name: Release

# Publish the @vector-nodes/* packages to npm via OIDC trusted publishing
# (no long-lived NPM_TOKEN). Triggered by publishing a GitHub Release, or
# manually. npm generates provenance automatically for trusted-publisher runs.
#
# One-time setup per package on npmjs.com → Package → Settings → Trusted
# Publisher: GitHub Actions, repo `sergeychernyshev/vector-nodes`, workflow
# `release.yml`. See docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the suite
        run: npm test

      # `--workspaces` publishes every workspace; the private `editor` is skipped
      # automatically. publishConfig.access:public is set in each package.json.
      - name: Publish
        run: npm publish --workspaces
