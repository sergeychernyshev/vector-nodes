name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy per ref; cancel superseded runs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy editor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # let wrangler-action post the preview URL on PRs
    # Mapped here so steps can skip cleanly when Cloudflare secrets are absent
    # (the `secrets` context is not available in `if:` conditions directly).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build editor
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build --workspace=editor

      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/editor
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload preview version
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/editor
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
