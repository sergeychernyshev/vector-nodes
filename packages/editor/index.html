<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Nodes — Editor</title>
    <style>
      /* Mirror the theme defaults from editor.css so the page paints in the
         user's preferred scheme before the bundle loads (no white flash). */
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        width: 100%;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #fff;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e1e;
          color: #ddd;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
